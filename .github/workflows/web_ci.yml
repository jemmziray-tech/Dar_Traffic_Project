name: Website checks
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web_ci.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web_ci.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
