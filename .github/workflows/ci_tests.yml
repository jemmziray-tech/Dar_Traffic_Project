name: CI — Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r scraper_requirements.txt --quiet
          pip install pytest pandas 'streamlit>=1.50.0' plotly --quiet

      - name: Run Unit Tests
        run: python -m pytest tests/ -v
