name: Scheduled AI Retraining

on:
  schedule:
    # Runs at 03:00 UTC daily (06:00 EAT — Dar es Salaam morning)
    - cron: '0 3 * * *'
  workflow_dispatch: # Run manually from GitHub Actions tab

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Create Firebase Key File
        run: |
          echo '${{ secrets.FIREBASE_KEY_JSON }}' > firebase-key.json

      - name: Run Training Script
        env:
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
        run: python train_model.py

      - name: Commit and Push Model + Metrics
        run: |
          git config --global user.name 'AI Retraining Bot'
          git config --global user.email 'bot@dartraffic.ai'
          git add traffic_model.pkl model_metrics.csv
          git commit -m "auto: daily AI retrain — updated model + MLOps metrics [skip ci]" || echo "No changes to commit"
          git push
