name: Collect traffic

# Collection is moving to Cloud Scheduler and Cloud Run.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: traffic-collection
  cancel-in-progress: false

jobs:
  scrape:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r scraper_requirements.txt --quiet

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: dar-traffic
          workload_identity_provider: projects/693791183501/locations/global/workloadIdentityPools/dar-traffic-github/providers/github
          service_account: dar-traffic-collector@dar-traffic.iam.gserviceaccount.com

      - name: Collect traffic
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: python scrape_traffic.py

