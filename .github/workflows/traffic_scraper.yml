name: Traffic Scraper Automation

on:
  schedule:
    # Runs every 30 minutes between 06:00 AM and 10:59 PM EATS
    # (Dar es Salaam UTC+3 → 03:00 to 19:59 UTC)
    - cron: '*/30 3-19 * * *'

  # Triggered manually or by repository_dispatch
  repository_dispatch:
    types: [trigger-scraper]

  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Hard timeout: kill job if it exceeds 8 minutes (prevents queue buildup)
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install scraper dependencies (fast)
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r scraper_requirements.txt --quiet

      - name: Run Scraper
        env:
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: python scrape_traffic.py

      - name: Report Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Traffic Scraper Failed!',
              body: `The scheduled scraper job failed. Please check the [Actions Logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            })
