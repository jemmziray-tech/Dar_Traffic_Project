name: Traffic Scraper Automation

on:
  schedule:
    # Runs every 20 minutes between 05:00 AM and 00:00 AM EATS
    # (Dar es Salaam UTC+3 → 02:00 to 21:59 UTC)
    - cron: '*/20 2-21 * * *'

  # Triggered manually or by repository_dispatch
  repository_dispatch:
    types: [trigger-scraper]

  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Hard timeout: kill job if it exceeds 8 minutes (prevents queue buildup)
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install scraper dependencies (fast)
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r scraper_requirements.txt --quiet

      - name: Run Scraper
        env:
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: python scrape_traffic.py
