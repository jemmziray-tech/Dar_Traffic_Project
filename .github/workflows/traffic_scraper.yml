name: Traffic Scraper Automation

on:
  schedule:
    # Runs every 30 minutes between 06:00 AM and 10:59 PM EATS
    # (Dar es Salaam UTC+3 → 03:00 to 19:59 UTC)
    - cron: '*/30 3-19 * * *'

  # Triggered manually or by repository_dispatch
  repository_dispatch:
    types: [trigger-scraper]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: traffic-collection
  cancel-in-progress: false

jobs:
  scrape:
    # Owner approved one manual collection; recurring triggers remain paused.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Hard timeout: kill job if it exceeds 8 minutes (prevents queue buildup)
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install scraper dependencies (fast)
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r scraper_requirements.txt --quiet

      - name: Authenticate to fresh Google project without a key
        uses: google-github-actions/auth@v3
        with:
          project_id: dar-traffic
          workload_identity_provider: projects/693791183501/locations/global/workloadIdentityPools/dar-traffic-github/providers/github
          service_account: dar-traffic-collector@dar-traffic.iam.gserviceaccount.com

      - name: Run Scraper
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: python scrape_traffic.py

