name: Traffic Scraper Automation

on:
  schedule:
    # Runs every 20 minutes between 05:00 AM and 00:00 AM EATS (Dar es Salaam time -> 02:00 to 21:59 UTC)
    - cron: '*/20 2-21 * * *'

  # Triggered by Google Cloud Scheduler if configured
  repository_dispatch:
    types: [trigger-scraper]

  # Allows manual run from GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper_requirements.txt

      - name: Run Unit Tests (Pytest)
        env:
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: pytest tests/

      - name: Run Scraper
        # We pass the secrets directly to the Python script in memory (No more echo!)
        env:
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python scrape_traffic.py
