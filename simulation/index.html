<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dar es Salaam AI Traffic Simulation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-panel">
        <div class="header">
            <h1>Dar Traffic AI</h1>
            <p>Interactive 3D Simulation</p>
        </div>

        <div class="control-group">
            <h3>Time of Day</h3>
            <div class="btn-group">
                <button class="time-btn active" data-time="morning">Morning Rush</button>
                <button class="time-btn" data-time="midday">Midday</button>
                <button class="time-btn" data-time="evening">Evening Rush</button>
            </div>
        </div>

        <div class="control-group">
            <h3>Weather</h3>
            <div class="btn-group">
                <button class="weather-btn active" data-weather="clear">Clear</button>
                <button class="weather-btn" data-weather="rainy">Rainy</button>
            </div>
        </div>

        <div class="control-group">
            <h3>Traffic Control System</h3>
            <div class="toggle-container">
                <span class="toggle-label">Standard Timer</span>
                <label class="switch">
                    <input type="checkbox" id="ai-toggle">
                    <span class="slider round"></span>
                </label>
                <span class="toggle-label highlight">AI Adaptive</span>
            </div>
            <p id="system-status" class="status-text">Fixed 10-second cycles. Prone to gridlock.</p>
        </div>

        <div class="metrics">
            <div class="metric-box">
                <span class="metric-value" id="q-ns">0</span>
                <span class="metric-title">N-S Queue</span>
            </div>
            <div class="metric-box">
                <span class="metric-value" id="q-ew">0</span>
                <span class="metric-title">E-W Queue</span>
            </div>
        </div>
    </div>

    <!-- Mobile toggle button for UI -->
    <button id="mobile-toggle">⚙️ Controls</button>

    <script src="app.js"></script>
</body>
</html>
